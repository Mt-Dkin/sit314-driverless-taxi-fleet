version: "3.9"

# Local stand-in for the AWS architecture in Figure 1, so the whole
# pipeline (edge -> ingestion -> microservices -> storage) can be
# demonstrated and stress-tested before deploying to AWS Learner Labs.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  mqtt-broker:
    build: ./simulator
    command: ["node", "local-broker.js"]
    ports: ["1883:1883", "8883:8883"]

  node-red:
    image: nodered/node-red:3.1
    ports: ["1880:1880"]
    volumes: ["./node-red/local:/data"]
    depends_on: [mqtt-broker]

  geofencing-tracking:
    build:
      context: ./microservices
      dockerfile: ./geofencing-tracking/Dockerfile
    environment:
      - MONGO_URL=mongodb://mongo:27017
    ports: ["3001:3001"]
    depends_on: [mongo]

  dispatch-billing:
    build:
      context: ./microservices
      dockerfile: ./dispatch-billing/Dockerfile
    ports: ["3002:3002"]

  alerting-maintenance:
    build:
      context: ./microservices
      dockerfile: ./alerting-maintenance/Dockerfile
    ports: ["3003:3003"]

  simulator:
    build: ./simulator
    command: ["node", "simulator.js"]
    environment:
      - MQTT_URL=mqtt://mqtt-broker:1883
      - FLEET_SIZE=20
      - PUBLISH_HZ=1
    depends_on: [mqtt-broker, node-red]

volumes:
  mongo-data:
